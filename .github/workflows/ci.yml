name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: engine (core)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (core engine + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run engine tests
        run: pytest -q

  gui:
    name: desktop GUI (offscreen)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the release-frozen target; 3.14 guards the modern stack (numpy 2.4 / pandas 3.0).
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Headless Qt: the offscreen platform plugin still dlopens these system libs.
      - name: Install headless Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install (engine + gui + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,dev]"
      # The GUI tests set QT_QPA_PLATFORM=offscreen themselves; run the full suite so the
      # desktop wiring (tabs, analyses) is actually exercised, not silently skipped.
      #
      # Run the suite in small per-process batches so the runner doesn't OOM. Each GUI test
      # builds a MainWindow (~400 eagerly-built hidden dialogs + a demo cube ≈ 1–2 GB), and
      # a closed window is NOT freed in-process: Qt signal/slot connection cycles keep it
      # alive past gc, and force-deleting it mid-run segfaults. In a single `pytest` the
      # windows from ~200 GUI tests pile up until the ~16 GB runner swaps and loses contact
      # with the server (the long-standing GUI-CI hang). Even one heavy file (test_gui)
      # exceeds 16 GB on its own, so per-file isn't enough — we batch by test id and run
      # each batch in its own process, letting the OS reclaim every window on exit. Peak RAM
      # is then bounded by the batch size, not the suite. Tests have no cross-batch order
      # dependency (verified locally), so this only changes memory, not what's exercised.
      - name: Run full test suite (engine + GUI), in memory-bounded batches
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          pytest --collect-only -q 2>/dev/null | grep '::' > /tmp/ids.txt
          echo "collected $(wc -l < /tmp/ids.txt) tests"
          # 5 tests/process: test_gui's tail creates a fresh ~1.5 GB MainWindow per test, so
          # a bigger batch there blows the 16 GB runner (25 OOM'd at ~window 11). 5 caps a
          # batch's live windows low enough for headroom on the heavier 3.14 runner too.
          split -l 5 /tmp/ids.txt /tmp/batch_
          rc_all=0
          n=0
          for b in /tmp/batch_*; do
            n=$((n + 1))
            echo "::group::batch $n ($(wc -l < "$b") tests)"
            tr '\n' '\0' < "$b" | xargs -0 pytest -q
            rc=$?
            echo "::endgroup::"
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 5 ]; then
              echo "::error::batch $n failed (rc=$rc)"
              rc_all=1
            fi
          done
          exit $rc_all
